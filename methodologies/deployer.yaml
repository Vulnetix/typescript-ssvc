    - public_poc
    - active

  SystemExposureLevel:
    - small
    - controlled
    - open

  UtilityLevel:
    - laborious
    - efficient
    - super_effective

  HumanImpactLevel:
    - low
    - medium
    - high
    - very_high

  ActionType:
    - defer
    - scheduled
    - out_of_cycle
    - immediate

  DecisionPriorityLevel:
    - low
    - medium
    - high
    - immediate

priorityMap:
  defer: low
  scheduled: medium
  out_of_cycle: high
  immediate: immediate

defaultAction: defer

