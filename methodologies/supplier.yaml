name: "Supplier"
description: "CERT/CC Supplier Decision Model"
version: "1.0"

enums:
  ExploitationStatus:
    - none
    - public_poc
    - active

  UtilityLevel:
    - laborious
    - efficient
    - super_effective

  TechnicalImpactLevel:
    - partial
    - total

  PublicSafetyImpactLevel:
    - minimal
    - significant

  ActionType:
    - defer
    - scheduled
    - out_of_cycle
    - immediate

  DecisionPriorityLevel:
    - low
    - medium
    - high
    - immediate

priorityMap:
  defer: low
  scheduled: medium
  out_of_cycle: high
  immediate: immediate

defaultAction: defer

decisionTree:
  # None exploitation scenarios
  # Row 1: None, Laborious, Partial, Minimal
  - conditions:
      exploitation: none
      utility: laborious
      technical_impact: partial
      public_safety_impact: minimal
    action: defer

  # Row 2: None, Laborious, Partial, Significant
  - conditions:
      exploitation: none
      utility: laborious
      technical_impact: partial
      public_safety_impact: significant
    action: scheduled

  # Row 3: None, Laborious, Total, Minimal
  - conditions:
      exploitation: none
      utility: laborious
      technical_impact: total
      public_safety_impact: minimal
    action: defer

  # Row 4: None, Laborious, Total, Significant
