name: Code Coverage

on:
  push:
    # Not Dependabot's branches: each update PR already runs its own checks, and a
    # run per branch push fanned seven Dependabot PRs into 70 jobs at once.
    # Tags are listed because any branch filter alone stops tag pushes.
    branches-ignore: ['dependabot/**']
    tags: ['**']
  pull_request:
jobs:
  build:

    runs-on: [self-hosted, Linux, X64, vulnetix-local]

    strategy:
      fail-fast: false
      matrix:
        # 18 and 19 are years past end of life and 19 was never an LTS line.
        # Testing against them says nothing about what anyone runs. 20 went
        # end of life in April 2026 and jsonpath-plus 11 requires Node 22, so
        # the floor is the engines field in package.json.
        node-version: ['22.x', '24.x']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # Before setup-node, not after: its package-manager-cache probe shells out
    # to `yarn`, and the runner's global yarn 1.22 refuses a project pinned to
    # yarn@4 with "This project's package.json defines packageManager".
    - name: Enable Corepack
      run: corepack enable

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn

    # npm, against a package.json that declares `packageManager: yarn@4.9.2`,
    # is what failed every run of this workflow: corepack enforces the
    # declaration and refuses. The repository's other two workflows already use
    # yarn; this one was the odd one out.
    - name: Install dependencies
      run: yarn install --immutable

    - name: Run the tests
      run: yarn test
