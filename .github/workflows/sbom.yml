name: SBOM Generation

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Install CycloneDX plugin
        run: yarn plugin import https://github.com/CycloneDX/cyclonedx-node-yarn/releases/latest/download/yarn-plugin-cyclonedx.cjs

      - name: Generate CycloneDX SBOM
        run: yarn cyclonedx --spec-version 1.6 --output-format JSON --output-file ssvc.cdx.json

      - name: Upload SBOM as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ssvc.cdx.json
          retention-days: 90

      - name: Upload SBOM to Vulnetix
        uses: vulnetix/vulnetix@main
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          task: upload
          upload-file: ssvc.cdx.json
