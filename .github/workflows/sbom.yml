name: SBOM Generation

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  VULNETIX_VERSION: v3.56.2

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      # Corepack must be enabled before setup-node, because setup-node's
      # package-manager-cache probe shells out to `yarn` and the runner's
      # global yarn 1.22 refuses a project pinned to yarn@4.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate CycloneDX SBOM
        run: yarn cyclonedx --spec-version 1.6 --output-format JSON --output-file ssvc.cdx.json

      - name: Upload SBOM as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom-cyclonedx
          path: ssvc.cdx.json
          retention-days: 7

  analyze:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
      VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: sca
            name: SCA
            run: vulnetix sca --no-banner --no-progress --verbose
            artifact: .vulnetix/sbom.cdx.json
          - id: cbom
            name: CBOM
            run: vulnetix cbom --output-file dist/ssvc.cbom.cdx.json --no-banner --no-progress --verbose
            artifact: dist/ssvc.cbom.cdx.json
          - id: aibom
            name: AIBOM
            run: vulnetix aibom --commit-scan-max 1 --output-file dist/ssvc.aibom.cdx.json --no-banner --no-progress --verbose
            artifact: dist/ssvc.aibom.cdx.json
          - id: license
            name: Licenses
            run: vulnetix license --no-banner --no-progress --verbose && cp .vulnetix/sbom.cdx.json dist/ssvc.licenses.cdx.json
            artifact: dist/ssvc.licenses.cdx.json
          - id: secrets
            name: Secrets
            run: vulnetix secrets --ignore-binaries --ignore-git --no-banner --no-progress --verbose && cp .vulnetix/sast.sarif dist/ssvc.secrets.sarif || true
            artifact: dist/ssvc.secrets.sarif

    steps:
      - uses: actions/checkout@v5

      - name: Install Vulnetix CLI
        run: |
          curl -fsSL https://cli.vulnetix.com/install.sh \
            | sh -s -- --install-dir "$HOME/.local/bin" --version "$VULNETIX_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate with Vulnetix
        run: vulnetix auth login --noninteractive --store project --no-banner --no-progress --verbose

      - name: Verify Vulnetix authentication
        run: vulnetix auth verify --no-banner --no-progress --verbose

      - name: Run ${{ matrix.name }}
        continue-on-error: true
        run: |
          mkdir -p dist
          ${{ matrix.run }}

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.id }}
          path: ${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [sbom, analyze]
    permissions:
      contents: write
      actions: read
    env:
      VULNETIX_ORG_ID: ${{ secrets.VULNETIX_ORG_ID }}
      VULNETIX_API_KEY: ${{ secrets.VULNETIX_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Vulnetix CLI
        run: |
          curl -fsSL https://cli.vulnetix.com/install.sh \
            | sh -s -- --install-dir "$HOME/.local/bin" --version "$VULNETIX_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate with Vulnetix
        run: vulnetix auth login --noninteractive --store project --no-banner --no-progress --verbose

      - name: Upload all artifacts to Vulnetix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vulnetix gha upload --org-id "$VULNETIX_ORG_ID" --json --no-banner --no-progress --verbose

      - name: Download all artifacts
        if: github.event_name == 'release'
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
