# Dependabot version updates. Security updates are enabled in the repository
# settings and run regardless of this file; this file adds the routine version
# bumps, which are the only way major upgrades (jest 29 to 30, and with it the
# glob 7 / minimatch 3 chain) get proposed.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # @types/node tracks the lowest supported Node (engines.node, 22), not
      # the newest: typing against a later major lets code call APIs a Node 22
      # user does not have and still compile. Move it with the engines floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ts-jest declares typescript >=4.3 <7 as its peer, so the bump to 7 fails
      # to resolve ("peer dependencies are incorrectly met"). Drop this once a
      # ts-jest release accepts the next typescript major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
